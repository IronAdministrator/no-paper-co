<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Set the theme before first paint: saved choice, else the system setting.
      (function () {
        var t;
        try {
          t = localStorage.getItem("np-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <title>NO_PAPER · Web &amp; Mobile App Studio</title>
    <meta
      name="description"
      content="NO_PAPER is a design and development studio turning ideas into web and mobile apps."
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
